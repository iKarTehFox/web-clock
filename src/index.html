    <body>
        <!-- Blur panel -->
        <div id="blur-panel"></div>
        <!-- Panel buttons -->
        <div id="panel-container">

                <i class="bi bi-terminal"></i>
            </button>
            <button type="button" id="countdown-button" class="btn btn-secondary" data-bs-toggle="tooltip" data-bs-placement="bottom" data-i18n-data-bs-title="panel.countdown.tooltip">
                <i class="bi bi-hourglass-bottom"></i>
            </button>
            <button type="button" id="stopwatch-button" class="btn btn-secondary" data-bs-toggle="tooltip" data-bs-placement="bottom" data-i18n-data-bs-title="panel.stopwatch.tooltip">
                <i class="bi bi-stopwatch"></i>
            </button>
            <button type="button" id="menu-button" class="btn btn-secondary" data-bs-toggle="offcanvas" data-bs-target="#menu-offcanvas" aria-controls="menu-offcanvas">
                <i class="bi bi-list"></i> <span data-i18n="panel.menu.label"></span>
            </button>
        </div>
        <!-- Dev console -->
        <div id="dev-console-container">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center" id="dev-console-header">
                    <span data-i18n="devcon.title"></span>
                    <button type="button" class="btn-close" id="dev-console-close" aria-label="Close"></button>
                </div>
                <div class="card-body">
                    <!-- Tab navigation -->
                    <ul class="nav nav-tabs mb-3" id="devConsoleTab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="console-tab" data-bs-toggle="tab" data-bs-target="#console-tab-pane" type="button" role="tab" aria-controls="console-tab-pane" aria-selected="true" data-i18n="devcon.tabs.console"></button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="logs-tab" data-bs-toggle="tab" data-bs-target="#logs-tab-pane" type="button" role="tab" aria-controls="logs-tab-pane" aria-selected="false" data-i18n="devcon.tabs.logs"></button>
                        </li>
                    </ul>
                    
                    <!-- Tab content -->
                    <div class="tab-content" id="devConsoleTabContent">
                        <!-- Console tab -->
                        <div class="tab-pane fade show active" id="console-tab-pane" role="tabpanel" aria-labelledby="console-tab" tabindex="0">
                            <div id="dev-console-output" class="mb-2"></div>
                            <div class="input-group">
                                <input type="text" id="dev-console-input" class="form-control" maxlength="150" data-i18n-placeholder="devcon.input.placeholder">
                                <button class="btn btn-outline-secondary" type="button" id="dev-console-submit" data-i18n="devcon.input.execute"></button>
                            </div>
                            <span class="mt-1 subtext-light" data-i18n="devcon.input.tip"></span>
                        </div>
                        
                        <!-- Logs tab -->
                        <div class="tab-pane fade" id="logs-tab-pane" role="tabpanel" aria-labelledby="logs-tab" tabindex="0">
                            <div id="dev-console-logs" class="mb-2"></div>
                            <!-- Log filters -->
                            <div class="btn-group" role="group" aria-label="Dev console log filters button group">
                                <input type="checkbox" class="btn-check" id="dev-console-logs-debug" autocomplete="off" checked>
                                <label class="btn btn-outline-secondary" for="dev-console-logs-debug" data-i18n="devcon.filters.debug"></label>

                                <input type="checkbox" class="btn-check" id="dev-console-logs-info" autocomplete="off" checked>
                                <label class="btn btn-outline-info" for="dev-console-logs-info" data-i18n="devcon.filters.info"></label>

                                <input type="checkbox" class="btn-check" id="dev-console-logs-warning" autocomplete="off" checked>
                                <label class="btn btn-outline-warning" for="dev-console-logs-warning" data-i18n="devcon.filters.warning"></label>

                                <input type="checkbox" class="btn-check" id="dev-console-logs-error" autocomplete="off" checked>
                                <label class="btn btn-outline-danger" for="dev-console-logs-error" data-i18n="devcon.filters.error"></label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
